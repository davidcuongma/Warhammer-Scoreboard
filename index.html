<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warzone Segmentum: Tournament Cogitator</title>
    <!-- Machine Spirits: External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background: #000; 
            height: 100vh; 
            overflow: hidden; 
            margin: 0; 
            color: #d1d1d1;
        }

        /* Tactical Scrollbars */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a2e1a; border-radius: 0px; border: 1px solid black; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #22c55e; }

        /* Animation Spirits */
        .animate-spin-slow { animation: spin 12s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @keyframes flicker {
          0% { opacity: 0.95; } 5% { opacity: 0.85; } 10% { opacity: 0.99; } 
          100% { opacity: 0.98; }
        }
        .cogitator-flicker { animation: flicker 0.2s infinite; }

        /* Scanline Overlay */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.15;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 40;
        }
    </style>
</head>
<body class="scanlines">
    <div class="vignette"></div>
    <div id="root"></div>

    <script type="text/babel">
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz5MulRB3tCo20Cyr5KjXeH0VNGQRHc-ibupRJ_R4q9m2sz9E4xypNMfzC2E8eQoZ51R5wtGJvmKHo/pub?output=csv";

        const { useState, useEffect, useRef, useMemo } = React;

        // --- FACTION THEMES (Expanded) ---
        const getFactionTheme = (faction) => {
            const f = (faction || "").toLowerCase();
            if (f.includes('tau')) return { color: '#ffffff', glow: 'rgba(255, 255, 255, 0.4)' };
            if (f.includes('ultra') || f.includes('space marine') || f.includes('raven')) return { color: '#3b82f6', glow: 'rgba(59, 130, 246, 0.5)' };
            if (f.includes('blood angel') || f.includes('world eater') || f.includes('chaos')) return { color: '#ef4444', glow: 'rgba(239, 68, 68, 0.5)' };
            if (f.includes('custodes') || f.includes('sons') || f.includes('adepta')) return { color: '#eab308', glow: 'rgba(234, 179, 8, 0.5)' };
            if (f.includes('necron')) return { color: '#22c55e', glow: 'rgba(34, 197, 94, 0.6)' };
            if (f.includes('tyranid')) return { color: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' };
            if (f.includes('eldar') || f.includes('aeldari')) return { color: '#facc15', glow: 'rgba(250, 204, 21, 0.4)' };
            if (f.includes('ork')) return { color: '#4d7c0f', glow: 'rgba(77, 124, 15, 0.4)' };
            return { color: '#10b981', glow: 'rgba(16, 185, 129, 0.3)' };
        };

        // --- ICON SPIRITS ---
        const Icons = {
            Target: ({className}) => (
                <svg className={className} width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10" opacity="0.3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                    <path d="M12 2v4m0 12v4M2 12h4m12 0h4" opacity="0.5"/>
                </svg>
            ),
            Trophy: ({style, size=24}) => <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            Faction: ({faction, className}) => {
                const theme = getFactionTheme(faction);
                return (
                    <svg className={className} style={{color: theme.color}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <circle cx="12" cy="12" r="9" opacity="0.2" />
                        <path d="M12 2v20M2 12h20" strokeWidth="1" opacity="0.3" />
                        <path d="M9 12l2 2 4-4" />
                    </svg>
                );
            }
        };

        const App = () => {
            const [players, setPlayers] = useState([]);
            const [matches, setMatches] = useState([]);
            const [round, setRound] = useState(1);
            const [activeTab, setActiveTab] = useState('engagements');
            const [loading, setLoading] = useState(false);
            const [logs, setLogs] = useState(["LOG_INIT: Standalone mode active.", "LOG_UPLINK: Waiting for Hub sync..."]);
            
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 50, y: 50 });
            const [isDragging, setIsDragging] = useState(false);
            const lastMousePos = useRef({ x: 0, y: 0 });

            useEffect(() => { syncHub(); }, []);

            const addLog = (msg) => setLogs(prev => [...prev.slice(-4), `LOG_${new Date().toLocaleTimeString().split(' ')[0]}: ${msg}`]);

            const syncHub = async (randomize = false) => {
                setLoading(true);
                addLog(randomize ? "DRAFT: Randomizing battle order..." : "FETCH: Contacting Segmentum Hub...");
                try {
                    const res = await fetch(SPREADSHEET_CSV_URL);
                    const text = await res.text();
                    const rows = text.split('\n').map(r => r.split(','));
                    const headers = rows[0].map(h => h.trim().toLowerCase());
                    
                    let data = rows.slice(1).map(row => {
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = (row[i] || "").trim());
                        return obj;
                    }).filter(p => p.playing === '1');

                    if (randomize) data = data.sort(() => Math.random() - 0.5);

                    const totalSlots = Math.pow(2, Math.ceil(Math.log2(data.length)));
                    const prepared = data.map((p, i) => ({ 
                        id: String(i), name: p.player || p.name, faction: p.army || p.faction, 
                        wins: 0, losses: 0 
                    }));
                    
                    const bracketPos = new Array(totalSlots).fill(null);
                    const pList = [...prepared];
                    for(let i=0; i<totalSlots/2; i++) {
                        bracketPos[i*2] = pList.shift();
                        if (pList.length > (totalSlots - data.length - i)) bracketPos[i*2+1] = pList.shift();
                        else bracketPos[i*2+1] = { id: 'BYE', name: 'LOGISTICAL BYE', faction: 'Mechanicus Support' };
                    }

                    const matchMap = {};
                    const totalPhases = Math.log2(totalSlots);
                    for(let r=1; r<=totalPhases; r++) {
                        const count = Math.pow(2, totalPhases - r);
                        for(let i=0; i<count; i++) {
                            const mid = `M${r}-${i}`;
                            matchMap[mid] = {
                                id: mid, p1: {id:'TBD', name:'TBD', faction:'Transit'}, p2: {id:'TBD', name:'TBD', faction:'Transit'},
                                winnerId: null, round: r, p1Odds: "1.80", p2Odds: "1.80",
                                nextMatchId: r < totalPhases ? `M${r+1}-${Math.floor(i/2)}` : null
                            };
                        }
                    }

                    for(let i=0; i<totalSlots; i+=2) {
                        const mid = `M1-${i/2}`;
                        const p1 = bracketPos[i];
                        const p2 = bracketPos[i+1];
                        matchMap[mid].p1 = p1;
                        matchMap[mid].p2 = p2;
                        if (p1.id === 'BYE') matchMap[mid].winnerId = p2.id;
                        else if (p2.id === 'BYE') matchMap[mid].winnerId = p1.id;
                        if (matchMap[mid].winnerId && matchMap[mid].nextMatchId) {
                            const win = [p1, p2].find(p => p.id === matchMap[mid].winnerId);
                            const isP1 = (i/2) % 2 === 0;
                            matchMap[matchMap[mid].nextMatchId][isP1 ? 'p1' : 'p2'] = win;
                        }
                    }

                    setPlayers(prepared);
                    setMatches(Object.values(matchMap));
                    setRound(1);
                    setLoading(false);
                    addLog(`SYNC: ${data.length} combatants deployed.`);
                } catch (err) {
                    addLog("ERR: Neural Link failure.");
                    setLoading(false);
                }
            };

            const resolveWin = (mId, pId) => {
                const match = matches.find(m => m.id === mId);
                const winner = [match.p1, match.p2].find(p => p.id === pId);
                addLog(`PURGE: ${winner.name.toUpperCase()} VICTORIOUS.`);
                setMatches(prev => {
                    let updated = prev.map(m => m.id === mId ? {...m, winnerId: pId} : m);
                    if (match.nextMatchId) {
                        const nextIdx = updated.findIndex(m => m.id === match.nextMatchId);
                        if (nextIdx !== -1) {
                            const isP1 = parseInt(mId.split('-')[1]) % 2 === 0;
                            updated[nextIdx][isP1 ? 'p1' : 'p2'] = winner;
                        }
                    }
                    return updated;
                });
            };

            const updateOdds = (mId, pIdx, val) => {
                setMatches(prev => prev.map(m => m.id === mId ? {...m, [pIdx === 1 ? 'p1Odds' : 'p2Odds']: val} : m));
            };

            const handleWheel = (e) => {
                if (activeTab !== 'tree') return;
                setZoom(z => Math.min(Math.max(0.4, z - e.deltaY * 0.001), 2));
            };

            const handleMouseDown = (e) => {
                if (activeTab !== 'tree') return;
                setIsDragging(true);
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            const handleMouseMove = (e) => {
                if (!isDragging || activeTab !== 'tree') return;
                const dx = e.clientX - lastMousePos.current.x;
                const dy = e.clientY - lastMousePos.current.y;
                setPosition(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            if (loading) return <div className="h-screen bg-black flex flex-col items-center justify-center text-green-500 font-black tracking-widest uppercase gap-4"><div className="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>AWAKENING COGITATOR...</div>;

            return (
                <div className="flex flex-col h-screen text-[#d1d1d1] p-6 select-none bg-[#050505] relative z-10" onMouseUp={() => setIsDragging(false)} onMouseLeave={() => setIsDragging(false)}>
                    <header className="flex justify-between items-center border-b-2 border-[#1a2e1a] pb-6 mb-6 bg-[#0f1a0f]/20 p-4">
                        <div className="flex items-center gap-6">
                            <Icons.Target className="animate-spin-slow text-green-500" />
                            <div>
                                <h1 className="text-3xl font-black text-white tracking-tighter uppercase">Warzone Segmentum</h1>
                                <div className="flex items-center gap-2 text-[9px] text-green-800 font-bold uppercase mt-1">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-ping" />
                                    Neural Uplink: Active // Sector 001-A
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => syncHub(false)} className="px-6 py-2 border-2 border-green-600 text-[10px] font-black hover:bg-green-600 hover:text-black transition-all bg-green-900/10 uppercase">Sync Hub</button>
                            <button onClick={() => syncHub(true)} className="px-6 py-2 border-2 border-amber-600 text-[10px] font-black hover:bg-amber-600 hover:text-black transition-all bg-amber-900/10 uppercase">Draft</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 flex-grow overflow-hidden gap-6">
                        {/* Sidebar: Tactical Bio */}
                        <aside className="lg:col-span-3 border-r-2 border-[#1a2e1a] p-4 bg-black/40 flex flex-col">
                            <h2 className="text-[11px] font-black border-b border-[#1a2e1a] mb-5 pb-2 uppercase text-green-500 flex items-center gap-2">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                Battle Roster
                            </h2>
                            <div className="space-y-2 mb-8 overflow-y-auto custom-scrollbar flex-grow pr-2">
                                {players.map(p => {
                                    const theme = getFactionTheme(p.faction);
                                    return (
                                        <div key={p.id} className="p-3 border border-[#1a2e1a] bg-green-950/5 flex items-center gap-4 transition-all">
                                            <Icons.Faction faction={p.faction} className="w-6 h-6" />
                                            <div className="min-w-0 flex-1">
                                                <div className="flex justify-between items-center">
                                                    <span className="text-[11px] font-black uppercase truncate text-white">{p.name}</span>
                                                </div>
                                                <div className="text-[9px] font-bold uppercase italic opacity-50 truncate" style={{color: theme.color}}>{p.faction}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <h2 className="text-[11px] font-black border-b border-[#1a2e1a] mb-3 pb-2 uppercase text-green-500">Neural Feed</h2>
                            <div className="space-y-2 text-[10px] font-mono text-zinc-600 italic leading-tight">
                                {logs.map((log, i) => (
                                    <div key={i} className={i === logs.length - 1 ? "text-green-400 font-bold" : ""}>» {log}</div>
                                ))}
                            </div>
                        </aside>

                        {/* Main Interaction Area */}
                        <main className="lg:col-span-9 flex flex-col overflow-hidden">
                            <div className="flex gap-2 p-1 border border-[#1a2e1a] bg-black/60 rounded-sm mb-6 flex-shrink-0">
                                <button onClick={() => setActiveTab('engagements')} className={`flex-1 py-3 text-[11px] font-black uppercase transition-all flex items-center justify-center gap-3 border ${activeTab === 'engagements' ? 'bg-green-600 text-black border-green-600 shadow-[0_0_20px_rgba(34,197,94,0.2)]' : 'text-zinc-600 border-transparent hover:text-green-600'}`}>Theatre of War</button>
                                <button onClick={() => setActiveTab('tree')} className={`flex-1 py-3 text-[11px] font-black uppercase transition-all flex items-center justify-center gap-3 border ${activeTab === 'tree' ? 'bg-green-600 text-black border-green-600 shadow-[0_0_20px_rgba(34,197,94,0.2)]' : 'text-zinc-600 border-transparent hover:text-green-600'}`}>Strategic Tree</button>
                            </div>

                            <div className="flex-grow bg-[#0a0a0a] border-2 border-[#1a2e1a] rounded-sm overflow-hidden relative shadow-2xl bg-[radial-gradient(circle_at_center,_#0d140d_0%,_#000000_100%)]">
                                {activeTab === 'engagements' ? (
                                    <div className="p-10 overflow-y-auto h-full custom-scrollbar grid grid-cols-1 md:grid-cols-2 gap-10">
                                        {matches.filter(m => m.round === round).map(m => (
                                            <EngagementCard key={m.id} match={m} onWin={resolveWin} onUpdateOdds={updateOdds} />
                                        ))}
                                        {matches.filter(m => m.round === round && m.winnerId).length === matches.filter(m => m.round === round).length && matches.some(m => m.round === round+1) && (
                                            <div className="col-span-full flex justify-center mt-4">
                                                <button onClick={() => setRound(r => r + 1)} className="px-12 py-4 bg-red-700 text-white text-xs font-black uppercase animate-bounce border-b-4 border-red-900 shadow-2xl">Initiate Phase 0{round+1}</button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="w-full h-full cursor-grab active:cursor-grabbing overflow-hidden" onWheel={handleWheel} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove}>
                                        <div className="p-20 transition-transform duration-75" style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`, transformOrigin: '0 0', width: 'max-content' }}>
                                            <div className="flex gap-24">
                                                {Array.from({length: Math.ceil(Math.log2(players.length || 2)) + 1}).map((_, rIdx) => {
                                                    const r = rIdx + 1;
                                                    const roundMatches = matches.filter(m => m.round === r);
                                                    if (roundMatches.length === 0) return null;
                                                    return (
                                                        <div key={rIdx} className="flex flex-col gap-10 justify-around">
                                                            <h4 className="text-[11px] font-black text-green-700 text-center border-b border-[#1a2e1a] pb-3 mb-4 uppercase tracking-[0.2em]">Stage 0{r}</h4>
                                                            {roundMatches.map(m => <TreeNode key={m.id} match={m} />)}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                    <footer className="mt-4 border-t-2 border-[#1a2e1a] pt-4 text-[10px] font-black text-green-900 flex justify-between tracking-[0.3em] uppercase italic">
                        <span>Neural Session: Active // WAR_COG_v.6.5</span>
                        <span className="text-green-500">For the Golden Throne!</span>
                    </footer>
                </div>
            );
        };

        const EngagementCard = ({ match, onWin, onUpdateOdds }) => (
            <div className="relative group border-2 border-[#1a2e1a] p-1 bg-black/40 shadow-lg">
                <div className="absolute -top-3 left-4 bg-black px-2 text-[9px] font-black border border-[#1a2e1a] text-green-600 uppercase z-10">Warzone Grid {match.id}</div>
                {[ {p: match.p1, o: match.p1Odds, idx: 1}, {p: match.p2, o: match.p2Odds, idx: 2}].map((item, i) => {
                    const theme = getFactionTheme(item.p.faction);
                    return (
                        <div key={i} className={`p-4 flex justify-between items-center transition-all ${match.winnerId === item.p.id ? 'bg-white/5' : ''}`} style={{ boxShadow: match.winnerId === item.p.id ? `inset 0 0 15px ${theme.glow}` : 'none' }}>
                            <div className="flex items-center gap-4 min-w-0">
                                <div className={`w-12 h-12 border-2 flex items-center justify-center ${match.winnerId === item.p.id ? 'border-white' : 'border-[#1a2e1a]'}`} style={{borderColor: match.winnerId === item.p.id ? theme.color : '#1a2e1a'}}>
                                    {match.winnerId === item.p.id ? <Icons.Trophy style={{color: theme.color}} size={20} /> : <Icons.Faction faction={item.p.faction} className="opacity-40" />}
                                </div>
                                <div className="min-w-0">
                                    <div className={`font-black uppercase text-sm truncate ${match.winnerId === item.p.id ? 'text-white' : 'text-zinc-500'}`}>{item.p.name}</div>
                                    <div className="text-[9px] font-bold uppercase italic opacity-40 truncate" style={{color: theme.color}}>{item.p.faction}</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                {!match.winnerId && item.p.id !== 'BYE' && item.p.id !== 'TBD' && (
                                    <div className="flex flex-col items-end">
                                        <span className="text-[8px] font-black text-green-900 mb-1">Odds</span>
                                        <input type="text" value={item.o} onChange={(e) => onUpdateOdds(match.id, item.idx, e.target.value)} className="bg-black border border-green-900 text-green-500 text-[10px] w-12 text-center p-1 focus:outline-none focus:border-green-400" />
                                    </div>
                                )}
                                {!match.winnerId && item.p.id !== 'BYE' && <button onClick={() => onWin(match.id, item.p.id)} className="px-6 py-2 border-2 border-green-600 text-[10px] font-black hover:bg-green-600 hover:text-black transition-all uppercase">Win</button>}
                                {match.winnerId === item.p.id && <span className="text-[10px] font-black text-green-400 animate-pulse tracking-widest border border-green-500 px-2 py-1 bg-green-950/20">Victor</span>}
                            </div>
                        </div>
                    );
                })}
            </div>
        );

        const TreeNode = ({ match }) => (
            <div className={`w-72 border-2 relative transition-all group ${match.winnerId ? 'border-green-600 bg-green-950/10' : 'border-[#1a2e1a] bg-black shadow-2xl'}`}>
                {[ {p: match.p1, o: match.p1Odds}, {p: match.p2, o: match.p2Odds}].map((item, pi) => (
                    <div key={pi}>
                        <div className={`p-4 flex justify-between items-center text-[12px] relative ${match.winnerId === item.p.id ? 'bg-green-600/10' : ''}`}>
                            <div className="flex items-center gap-3 truncate">
                                <Icons.Faction faction={item.p.faction} className="w-5 h-5" />
                                <span className={`truncate uppercase font-black ${match.winnerId === item.p.id ? 'text-white' : (item.p.id === 'TBD' ? 'text-zinc-800' : 'text-zinc-500')}`}>{item.p.name}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                {item.p.id !== 'TBD' && item.p.id !== 'BYE' && <span className="text-[9px] text-green-700 font-bold opacity-60 tracking-wider">{item.o}</span>}
                                {match.winnerId === item.p.id && <Icons.Trophy size={14} className="text-green-400" />}
                            </div>
                        </div>
                        {pi === 0 && <div className="h-[1px] bg-[#1a2e1a] relative"><div className="absolute left-0 h-full bg-green-600 transition-all duration-700" style={{width: match.winnerId ? '100%' : '0%'}}></div></div>}
                    </div>
                ))}
                {match.nextMatchId && <div className="absolute top-1/2 -right-24 w-24 h-[2px] bg-[#1a2e1a] -translate-y-1/2 overflow-hidden"><div className="h-full bg-green-600 transition-all duration-700" style={{width: match.winnerId ? '100%' : '0%'}}></div></div>}
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
