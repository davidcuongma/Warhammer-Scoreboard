<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warzone Segmentum: Tournament Cogitator</title>
    <!-- Tactical Spirits: Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background: #000; 
            height: 100vh; 
            overflow: hidden; 
            margin: 0; 
            color: #d1d1d1;
        }

        /* Tactical Scrollbars */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #000; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a2e1a; border-radius: 0px; border: 1px solid black; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #22c55e; }

        /* Animation Spirits */
        .animate-spin-slow { animation: spin 12s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @keyframes flicker {
          0% { opacity: 0.95; } 5% { opacity: 0.85; } 10% { opacity: 0.99; } 
          100% { opacity: 0.98; }
        }
        .cogitator-flicker { animation: flicker 0.2s infinite; }

        /* Scanline Overlay */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.15;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 40;
        }
        
        /* Bracket Connectivity Fix */
        .tree-column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-height: 100%;
        }
    </style>
</head>
<body class="scanlines">
    <div class="vignette"></div>
    <div id="root"></div>

    <script type="text/babel">
        const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz5MulRB3tCo20Cyr5KjXeH0VNGQRHc-ibupRJ_R4q9m2sz9E4xypNMfzC2E8eQoZ51R5wtGJvmKHo/pub?output=csv";

        const { useState, useEffect, useRef, useMemo } = React;

        // --- FACTION HERALDRY ---
        const getFactionTheme = (faction) => {
            const f = (faction || "").toLowerCase();
            if (f.includes('tau')) return { color: '#ffffff', glow: 'rgba(255, 255, 255, 0.4)' };
            if (f.includes('ultra') || f.includes('space marine') || f.includes('raven')) return { color: '#3b82f6', glow: 'rgba(59, 130, 246, 0.5)' };
            if (f.includes('blood angel') || f.includes('world eater') || f.includes('chaos') || f.includes('khorne')) return { color: '#ef4444', glow: 'rgba(239, 68, 68, 0.5)' };
            if (f.includes('custodes') || f.includes('sons') || f.includes('adepta') || f.includes('sister')) return { color: '#eab308', glow: 'rgba(234, 179, 8, 0.5)' };
            if (f.includes('necron')) return { color: '#22c55e', glow: 'rgba(34, 197, 94, 0.6)' };
            if (f.includes('tyranid')) return { color: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' };
            if (f.includes('eldar') || f.includes('aeldari')) return { color: '#facc15', glow: 'rgba(250, 204, 21, 0.4)' };
            if (f.includes('ork') || f.includes('death guard')) return { color: '#4d7c0f', glow: 'rgba(77, 124, 15, 0.4)' };
            return { color: '#10b981', glow: 'rgba(16, 185, 129, 0.3)' };
        };

        // --- TACTICAL ICONS (SVG replacements for Lucide) ---
        const Icons = {
            Target: ({className}) => (
                <svg className={className} width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="12" cy="12" r="10" opacity="0.3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                    <path d="M12 2v4m0 12v4M2 12h4m12 0h4" opacity="0.5"/>
                </svg>
            ),
            Trophy: ({style, size=24}) => (
                <svg width={size} height={size} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
                </svg>
            ),
            Skull: ({className, style}) => (
                <svg className={className} style={style} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M9 10L9.01 10"/><path d="M15 10L15.01 10"/><path d="M12 2a8 8 0 0 0-8 8v1a2 2 0 0 0 2 2 1 1 0 0 1 1 1v3a4 4 0 0 0 4 4h2a4 4 0 0 0 4-4v-3a1 1 0 0 1 1-1 2 2 0 0 0 2-2v-1a8 8 0 0 0-8-8z"/><path d="M10 18h4"/>
                </svg>
            ),
            Sync: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>,
            Draft: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/></svg>,
            Redemption: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        };

        const App = () => {
            const [players, setPlayers] = useState([]);
            const [matches, setMatches] = useState([]);
            const [round, setRound] = useState(1);
            const [bracketType, setBracketType] = useState('single');
            const [activeTab, setActiveTab] = useState('engagements');
            const [loading, setLoading] = useState(true);
            const [logs, setLogs] = useState(["LOG_INIT: Standalone session active.", "LOG_UPLINK: Establishing link to Hub..."]);
            
            const [zoom, setZoom] = useState(1);
            const [position, setPosition] = useState({ x: 50, y: 50 });
            const [isDragging, setIsDragging] = useState(false);
            const lastMousePos = useRef({ x: 0, y: 0 });

            useEffect(() => { syncHub(); }, []);

            const addLog = (msg) => setLogs(prev => [...prev.slice(-4), `LOG_${new Date().toLocaleTimeString().split(' ')[0]}: ${String(msg)}`]);

            const generateFullBracket = (playerList, type = 'single') => {
                const numPlayers = playerList.length;
                const totalRounds = Math.ceil(Math.log2(numPlayers));
                const totalSlots = Math.pow(2, totalRounds);
                const matchMap = {};

                const preparedPlayers = [...playerList];
                const numByes = totalSlots - numPlayers;
                const bracketPositions = new Array(totalSlots).fill(null);
                
                // Balanced Distribution
                for(let i = 0; i < totalSlots / 2; i++) {
                    bracketPositions[i * 2] = preparedPlayers.shift();
                    if (preparedPlayers.length > (numByes - (numByes - (totalSlots - numPlayers - preparedPlayers.length)))) {
                        bracketPositions[i * 2 + 1] = preparedPlayers.shift();
                    } else {
                        bracketPositions[i * 2 + 1] = { id: 'BYE', name: 'LOGISTICAL BYE', faction: 'Mechanicus Support' };
                    }
                }

                for (let r = 1; r <= totalRounds; r++) {
                    const count = Math.pow(2, totalRounds - r);
                    for (let i = 0; i < count; i++) {
                        const mid = `M${r}-${i}`;
                        matchMap[mid] = {
                            id: mid, p1: {id:'TBD', name:'TBD', faction:'Transit'}, p2: {id:'TBD', name:'TBD', faction:'Transit'},
                            winnerId: null, round: r, p1Odds: "1.80", p2Odds: "1.80", type: 'winners',
                            nextMatchId: r < totalRounds ? `M${r+1}-${Math.floor(i/2)}` : null
                        };
                    }
                }

                for(let i = 0; i < totalSlots; i += 2) {
                    const mid = `M1-${i/2}`;
                    const p1 = bracketPositions[i];
                    const p2 = bracketPositions[i + 1];
                    matchMap[mid].p1 = p1;
                    matchMap[mid].p2 = p2;
                    if (p1.id === 'BYE') matchMap[mid].winnerId = p2.id;
                    else if (p2.id === 'BYE') matchMap[mid].winnerId = p1.id;
                    if (matchMap[mid].winnerId && matchMap[mid].nextMatchId) {
                        const win = [p1, p2].find(p => p.id === matchMap[mid].winnerId);
                        const isP1 = (i/2) % 2 === 0;
                        matchMap[matchMap[mid].nextMatchId][isP1 ? 'p1' : 'p2'] = win;
                    }
                }

                let allMatches = Object.values(matchMap);

                if (type === 'double') {
                    for (let r = 1; r < totalRounds; r++) {
                        const count = Math.pow(2, totalRounds - r - 1) || 1;
                        for(let i=0; i < count; i++) {
                            allMatches.push({
                                id: `L${r}-${i}`, p1: { id: 'TBD', name: 'TBD (Redemption)', faction: 'Defeated' }, p2: { id: 'TBD', name: 'TBD (Redemption)', faction: 'Defeated' },
                                p1Odds: "2.00", p2Odds: "2.00", winnerId: null, round: r, type: 'losers'
                            });
                        }
                    }
                }

                return allMatches;
            };

            const syncHub = async (randomize = false, forcedType = null) => {
                setLoading(true);
                const typeToUse = forcedType || bracketType;
                addLog(randomize ? "DRAFT: Randomizing battle order..." : `SYNC: Pulling data. Mode: ${typeToUse.toUpperCase()}`);
                try {
                    const res = await fetch(SPREADSHEET_CSV_URL);
                    const text = await res.text();
                    const rows = text.split('\n').map(r => r.split(','));
                    const headers = rows[0].map(h => h.trim().toLowerCase());
                    
                    let data = rows.slice(1).map(row => {
                        let obj = {};
                        headers.forEach((h, i) => obj[h] = (row[i] || "").trim());
                        return obj;
                    }).filter(p => p.playing === '1');

                    if (randomize) {
                        for (let i = data.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [data[i], data[j]] = [data[j], data[i]];
                        }
                    }

                    const parsed = data.map((p, i) => ({ 
                        id: String(i), name: String(p.player || p.name), faction: String(p.army || p.faction), wins: 0, losses: 0 
                    }));

                    const initialBracket = generateFullBracket(parsed, typeToUse);
                    setPlayers(parsed);
                    setMatches(initialBracket);
                    setRound(1);
                    setBracketType(typeToUse);
                    addLog(`RECRUITMENT: ${parsed.length} combatants deployed.`);
                } catch (err) {
                    addLog("ERR: Connection to Hub failed.");
                } finally {
                    setLoading(false);
                }
            };

            const resolveWin = (mId, pId) => {
                const match = matches.find(m => m.id === mId);
                const winner = [match.p1, match.p2].find(p => p.id === pId);
                const loserId = match.p1.id === pId ? match.p2.id : match.p1.id;
                const loser = [match.p1, match.p2].find(p => p.id === loserId);
                
                addLog(`PURGE: ${String(winner.name).toUpperCase()} HAS TRIUMPHED.`);

                setMatches(prev => {
                    let updated = prev.map(m => m.id === mId ? { ...m, winnerId: pId } : m);
                    if (match.nextMatchId) {
                        const isP1 = parseInt(mId.split('-')[1]) % 2 === 0;
                        updated = updated.map(m => m.id === match.nextMatchId ? { ...m, [isP1 ? 'p1' : 'p2']: winner } : m);
                    }
                    if (bracketType === 'double' && match.type === 'winners' && loser && loser.id !== 'BYE') {
                        const losersRoundMatchId = `L${match.round}-${Math.floor(parseInt(mId.split('-')[1]) / 2)}`;
                        updated = updated.map(m => {
                            if (m.id === losersRoundMatchId) {
                                const isP1Spot = parseInt(mId.split('-')[1]) % 2 === 0;
                                return { ...m, [isP1Spot ? 'p1' : 'p2']: loser };
                            }
                            return m;
                        });
                    }
                    return updated;
                });
            };

            const updateOdds = (mId, pIdx, val) => {
                setMatches(prev => prev.map(m => m.id === mId ? { ...m, [pIdx === 1 ? 'p1Odds' : 'p2Odds']: String(val) } : m));
            };

            const handleWheel = (e) => {
                if (activeTab !== 'tree') return;
                setZoom(z => Math.min(Math.max(0.4, z - e.deltaY * 0.001), 2));
            };

            const handleMouseDown = (e) => {
                if (activeTab !== 'tree') return;
                setIsDragging(true);
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            const handleMouseMove = (e) => {
                if (!isDragging || activeTab !== 'tree') return;
                const dx = e.clientX - lastMousePos.current.x;
                const dy = e.clientY - lastMousePos.current.y;
                setPosition(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                lastMousePos.current = { x: e.clientX, y: e.clientY };
            };

            if (loading) return <div className="h-screen bg-black flex flex-col items-center justify-center text-green-500 font-black tracking-widest uppercase gap-4"><div className="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin"></div>AWAKENING COGITATOR...</div>;

            return (
                <div className="flex flex-col h-screen text-[#d1d1d1] p-6 select-none bg-[#050505] relative z-10" onMouseUp={() => setIsDragging(false)} onMouseLeave={() => setIsDragging(false)}>
                    <header className="flex justify-between items-center border-b-2 border-[#1a2e1a] pb-6 mb-6 bg-[#0f1a0f]/20 p-4">
                        <div className="flex items-center gap-6">
                            <Icons.Target className="animate-spin-slow text-green-500" />
                            <div>
                                <h1 className="text-3xl font-black text-white tracking-tighter uppercase">Warzone Segmentum</h1>
                                <div className="flex items-center gap-2 text-[9px] text-green-800 font-bold uppercase mt-1">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-ping" />
                                    Neural Uplink: Active // Session: {bracketType.toUpperCase()}
                                </div>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <div className="flex border-2 border-[#1a2e1a] rounded overflow-hidden mr-4">
                                <button onClick={() => syncHub(false, 'single')} className={`px-4 py-1 text-[10px] font-black uppercase transition-all ${bracketType === 'single' ? 'bg-green-600 text-black shadow-[0_0_10px_rgba(0,255,0,0.3)]' : 'text-green-800'}`}>Single</button>
                                <button onClick={() => syncHub(false, 'double')} className={`px-4 py-1 text-[10px] font-black uppercase transition-all ${bracketType === 'double' ? 'bg-green-600 text-black shadow-[0_0_10px_rgba(0,255,0,0.3)]' : 'text-green-800'}`}>Double</button>
                            </div>
                            <button onClick={() => syncHub(false)} className="px-6 py-2 border-2 border-green-600 text-[10px] font-black hover:bg-green-600 hover:text-black transition-all bg-green-900/10 uppercase flex items-center gap-2"><Icons.Sync/> Sync Hub</button>
                            <button onClick={() => syncHub(true)} className="px-6 py-2 border-2 border-amber-600 text-[10px] font-black hover:bg-amber-600 hover:text-black transition-all bg-amber-900/10 uppercase flex items-center gap-2"><Icons.Draft/> Draft</button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 flex-grow overflow-hidden gap-6">
                        <aside className="lg:col-span-3 border-r-2 border-[#1a2e1a] p-4 bg-black/40 flex flex-col">
                            <h2 className="text-[11px] font-black border-b border-[#1a2e1a] mb-5 pb-2 uppercase text-green-500 flex items-center gap-2">Battle Roster</h2>
                            <div className="space-y-2 mb-8 overflow-y-auto custom-scrollbar flex-grow pr-2">
                                {players.map(p => {
                                    const theme = getFactionTheme(p.faction);
                                    return (
                                        <div key={p.id} className="p-3 border border-[#1a2e1a] bg-green-950/5 flex items-center gap-4 transition-all">
                                            <Icons.Skull className="w-6 h-6" style={{color: theme.color}} />
                                            <div className="min-w-0 flex-1">
                                                <div className="flex justify-between items-center text-[11px] font-black uppercase truncate text-white">{p.name}</div>
                                                <div className="text-[9px] font-bold uppercase italic opacity-50 truncate" style={{color: theme.color}}>{p.faction}</div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <h2 className="text-[11px] font-black border-b border-[#1a2e1a] mb-3 pb-2 uppercase text-green-500">Neural Feed</h2>
                            <div className="space-y-2 text-[10px] font-mono text-zinc-600 italic leading-tight">
                                {logs.map((log, i) => (
                                    <div key={i} className={i === logs.length - 1 ? "text-green-400 font-bold" : ""}>» {log}</div>
                                ))}
                            </div>
                        </aside>

                        <main className="lg:col-span-9 flex flex-col overflow-hidden">
                            <div className="flex gap-2 p-1 border border-[#1a2e1a] bg-black/60 rounded-sm mb-6 flex-shrink-0">
                                <button onClick={() => setActiveTab('engagements')} className={`flex-1 py-3 text-[11px] font-black uppercase transition-all flex items-center justify-center gap-3 border ${activeTab === 'engagements' ? 'bg-green-600 text-black border-green-600 shadow-[0_0_20px_rgba(34,197,94,0.2)]' : 'text-zinc-600 border-transparent hover:text-green-600'}`}>Theatre of War</button>
                                <button onClick={() => setActiveTab('tree')} className={`flex-1 py-3 text-[11px] font-black uppercase transition-all flex items-center justify-center gap-3 border ${activeTab === 'tree' ? 'bg-green-600 text-black border-green-600 shadow-[0_0_20px_rgba(34,197,94,0.2)]' : 'text-zinc-600 border-transparent hover:text-green-600'}`}>Strategic Tree</button>
                            </div>

                            <div className="flex-grow bg-[#0a0a0a] border-2 border-[#1a2e1a] rounded-sm overflow-hidden relative shadow-2xl bg-[radial-gradient(circle_at_center,_#0d140d_0%,_#000000_100%)]">
                                {activeTab === 'engagements' ? (
                                    <div className="p-10 overflow-y-auto h-full custom-scrollbar">
                                        <div className="flex items-center justify-between gap-4 border-l-4 border-green-600 pl-6 mb-8">
                                            <h2 className="text-2xl font-black uppercase tracking-tighter text-white">Phase 0{round}</h2>
                                            {matches.filter(m => m.round === round && m.winnerId).length === matches.filter(m => m.round === round).length && matches.some(m => m.round === round+1) && (
                                                <button onClick={() => setRound(r => r + 1)} className="px-12 py-4 bg-red-700 text-white text-xs font-black uppercase animate-bounce border-b-4 border-red-900 shadow-2xl">Initiate Phase 0{round+1}</button>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-10 pb-10">
                                            {matches.filter(m => m.round === round && m.type === 'winners').map(m => (
                                                <EngagementCard key={m.id} match={m} onWin={resolveWin} onUpdateOdds={updateOdds} />
                                            ))}
                                        </div>
                                        {bracketType === 'double' && matches.some(m => m.round === round && m.type === 'losers') && (
                                            <div className="mt-20 space-y-10">
                                                <h3 className="text-2xl font-black uppercase text-red-600 border-l-4 border-red-600 pl-6 flex items-center gap-3"><Icons.Redemption/> Redemption Theatre</h3>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10 pb-10">
                                                    {matches.filter(m => m.round === round && m.type === 'losers').map(m => (
                                                        <EngagementCard key={m.id} match={m} onWin={resolveWin} onUpdateOdds={updateOdds} isRedemption />
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="w-full h-full cursor-grab active:cursor-grabbing overflow-hidden" onWheel={handleWheel} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove}>
                                        <div className="p-20 transition-transform duration-75" style={{ transform: `translate(${position.x}px, ${position.y}px) scale(${zoom})`, transformOrigin: '0 0', width: 'max-content' }}>
                                            <div className="flex gap-24 h-full">
                                                {Array.from({length: Math.ceil(Math.log2(players.length || 2)) + 1}).map((_, rIdx) => {
                                                    const r = rIdx + 1;
                                                    const roundMatches = matches.filter(m => m.round === r && m.type === 'winners');
                                                    if (roundMatches.length === 0) return null;
                                                    return (
                                                        <div key={rIdx} className="tree-column">
                                                            <h4 className="text-[11px] font-black text-green-700 text-center border-b border-[#1a2e1a] pb-3 mb-10 uppercase tracking-[0.2em]">Stage 0{r}</h4>
                                                            {roundMatches.map(m => <TreeNode key={m.id} match={m} />)}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                    <footer className="mt-4 border-t-2 border-[#1a2e1a] pt-4 text-[10px] font-black text-green-900 flex justify-between tracking-[0.3em] uppercase italic">
                        <span>Neural Session: Active // WAR_COG_v.9.5</span>
                        <span className="text-green-500">For the Golden Throne!</span>
                    </footer>
                </div>
            );
        };

        const EngagementCard = ({ match, onWin, onUpdateOdds, isRedemption = false }) => (
            <div className={`relative group border-2 p-1 bg-black/40 shadow-lg ${isRedemption ? 'border-red-900/50' : 'border-[#1a2e1a]'}`}>
                <div className={`absolute -top-3 left-4 bg-black px-2 text-[9px] font-black border uppercase z-10 tracking-widest ${isRedemption ? 'border-red-900 text-red-600' : 'border-[#1a2e1a] text-green-600'}`}>Zone {match.id}</div>
                {[ {p: match.p1, o: match.p1Odds, idx: 1}, {p: match.p2, o: match.p2Odds, idx: 2}].map((item, i) => {
                    const theme = getFactionTheme(item.p.faction);
                    return (
                        <div key={i} className={`p-4 flex justify-between items-center transition-all ${match.winnerId === item.p.id ? 'bg-white/5' : ''}`} style={{ boxShadow: match.winnerId === item.p.id ? `inset 0 0 15px ${theme.glow}` : 'none' }}>
                            <div className="flex items-center gap-4 min-w-0">
                                <div className={`w-12 h-12 border-2 flex items-center justify-center ${match.winnerId === item.p.id ? 'border-white' : 'border-[#1a2e1a]'}`} style={{borderColor: match.winnerId === item.p.id ? theme.color : '#1a2e1a'}}>
                                    {match.winnerId === item.p.id ? <Icons.Trophy style={{color: theme.color}} size={20} /> : <Icons.Skull className="opacity-40" style={{color: theme.color}} />}
                                </div>
                                <div className="min-w-0">
                                    <div className={`font-black uppercase text-sm truncate ${match.winnerId === item.p.id ? 'text-white' : 'text-zinc-500'}`}>{item.p.name}</div>
                                    <div className="text-[9px] font-bold uppercase italic opacity-40 truncate" style={{color: theme.color}}>{item.p.faction}</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                {!match.winnerId && item.p.id !== 'BYE' && item.p.id !== 'TBD' && (
                                    <div className="flex flex-col items-end mr-2">
                                        <span className="text-[8px] font-black text-green-900 mb-1 uppercase tracking-tighter">Odds</span>
                                        <input type="text" value={item.o} onChange={(e) => onUpdateOdds(match.id, item.idx, e.target.value)} className="bg-black border border-green-900 text-green-500 text-[10px] w-12 text-center p-1 focus:outline-none focus:border-green-400" />
                                    </div>
                                )}
                                {!match.winnerId && item.p.id !== 'BYE' && <button onClick={() => onWin(match.id, item.p.id)} className={`px-6 py-2 border-2 text-[10px] font-black transition-all uppercase ${isRedemption ? 'border-red-600 hover:bg-red-600 hover:text-black' : 'border-green-600 hover:bg-green-600 hover:text-black'}`}>Win</button>}
                                {match.winnerId === item.p.id && <span className={`text-[10px] font-black animate-pulse tracking-widest border px-2 py-1 bg-green-950/20 ${isRedemption ? 'border-red-500 text-red-500' : 'border-green-500 text-green-400'}`}>Victor</span>}
                            </div>
                        </div>
                    );
                })}
            </div>
        );

        const TreeNode = ({ match }) => (
            <div className={`w-72 border-2 relative transition-all group my-6 ${match.winnerId ? 'border-green-600 bg-green-950/10 shadow-[0_0_20px_rgba(0,255,0,0.1)]' : 'border-[#1a2e1a] bg-black shadow-2xl'}`}>
                {[ {p: match.p1, o: match.p1Odds}, {p: match.p2, o: match.p2Odds}].map((item, pi) => (
                    <div key={pi}>
                        <div className={`p-4 flex justify-between items-center text-[12px] relative ${match.winnerId === item.p.id ? 'bg-green-600/10' : ''}`}>
                            <div className="flex items-center gap-3 truncate">
                                <Icons.Skull className="w-5 h-5" style={{color: getFactionTheme(item.p.faction).color}} />
                                <span className={`truncate uppercase font-black ${match.winnerId === item.p.id ? 'text-white' : (item.p.id === 'TBD' ? 'text-zinc-800' : 'text-zinc-500')}`}>{item.p.name}</span>
                            </div>
                            <div className="flex items-center gap-2">
                                {item.p.id !== 'TBD' && item.p.id !== 'BYE' && <span className="text-[9px] text-green-700 font-bold opacity-60 tracking-wider">{item.o}</span>}
                                {match.winnerId === item.p.id && <Icons.Trophy size={14} className="text-green-400" />}
                            </div>
                        </div>
                        {pi === 0 && <div className="h-[1px] bg-[#1a2e1a] relative"><div className="absolute left-0 h-full bg-green-600 transition-all duration-700" style={{width: match.winnerId ? '100%' : '0%'}}></div></div>}
                    </div>
                ))}
                {match.nextMatchId && (
                    <>
                        <div className="absolute top-1/2 -right-24 w-24 h-[2px] bg-[#1a2e1a] -translate-y-1/2 overflow-hidden">
                            <div className="h-full bg-green-600 transition-all duration-700" style={{width: match.winnerId ? '100%' : '0%'}}></div>
                        </div>
                        <div className={`absolute -right-24 w-[2px] bg-[#1a2e1a]`} 
                             style={{ 
                                height: '50%',
                                top: parseInt(match.id.split('-')[1]) % 2 === 0 ? '50%' : 'auto',
                                bottom: parseInt(match.id.split('-')[1]) % 2 === 1 ? '50%' : 'auto',
                             }}>
                             <div className="w-full bg-green-600 transition-all duration-700" style={{ height: match.winnerId ? '100%' : '0%' }}></div>
                        </div>
                    </>
                )}
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
